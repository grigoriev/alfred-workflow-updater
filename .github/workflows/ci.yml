name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: shellcheck update.sh

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats
        run: brew install bats-core
      - name: Test
        run: bats tests

  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run tests under kcov
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" kcov/kcov:latest bash -c \
            "apt-get update -qq && apt-get install -y -qq bats jq >/dev/null && kcov --include-pattern=update.sh coverage bats tests"
      - name: Convert coverage to SonarQube format
        run: |
          python3 .github/coverage-to-sonar.py coverage sonar-coverage.xml
          echo "== uncovered lines =="; grep 'covered="false"' sonar-coverage.xml || echo "(all covered)"
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
