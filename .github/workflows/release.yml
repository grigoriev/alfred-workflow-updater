name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bundle updater scripts
        run: tar -czf updater.tar.gz update.sh autoupdate.sh

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" update.sh autoupdate.sh updater.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
